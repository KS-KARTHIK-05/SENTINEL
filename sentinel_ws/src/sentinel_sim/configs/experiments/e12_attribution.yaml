# E12 attribution of SENTINEL's margin (internal review, issues 3 and 6): components removed
# jointly, the baselines with SENTINEL's corroborative fusion added, and the link-violation
# counterfactual without the projection. Same scenarios and seeds as E7 (paired with sentinel).
tuned_file: configs/tuned.yaml
base: {duration_s: 600, map: {kind: generate, size: 400, n_targets: 25, base: true}, failures: {kind: poisson, rate: 0.01}, policy_path: configs/mappo_policy.npz}
grid:
  channel.profile: [urban_rubble, severe]
  n_uav: [4, 8]
methods: [sentinel, abl_no_projection, sentinel_th_inf, abl_no_fusion, abl_no_fusion_no_delivery, abl_no_sa_no_fusion, abl_no_sa_no_fusion_no_delivery, B0_pso_fusion, B1_v1_fusion, B2_commpso_fusion, B3_lambda2_fusion, B4_potential_fusion, B5_mappo_fusion, B6_lawnmower_fusion]
seeds: 30
